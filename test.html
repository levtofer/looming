<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you are still here</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Libre+Baskerville:ital@0;1&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080807;
    --dim: #24231f;
    --text: #b7b2a4;
    --faint: #555249;
    --red: #6f2828;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
}

body {
    font-family: "IBM Plex Mono", monospace;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 1px,
            transparent 4px
        );
    z-index: 20;
}

body::after {
    content: "";
    position: fixed;
    inset: -20%;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0,0,0,.72) 78%,
        #000 100%
    );
    z-index: 19;
}

.noise {
    position: fixed;
    inset: 0;
    opacity: .035;
    z-index: 18;
    pointer-events: none;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.room {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.window {
    position: absolute;
    width: 260px;
    height: 390px;
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
    border: 1px solid #1d1c19;
    background:
        linear-gradient(
            90deg,
            transparent 49.5%,
            #1a1916 49.5%,
            #1a1916 50.5%,
            transparent 50.5%
        ),
        linear-gradient(
            0deg,
            transparent 49.5%,
            #1a1916 49.5%,
            #1a1916 50.5%,
            transparent 50.5%
        ),
        #0b0b09;
    box-shadow:
        0 0 80px rgba(40,40,32,.08),
        inset 0 0 50px #000;
}

.window::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 50% 55%,
            rgba(100,100,85,.035),
            transparent 55%
        );
}

.shadow {
    position: absolute;
    width: 150px;
    height: 290px;
    left: calc(50% + 160px);
    top: 21%;
    opacity: .13;
    filter: blur(16px);
    background: #000;
    border-radius: 50% 50% 15% 15%;
    transform: scaleX(.65);
}

.table {
    position: absolute;
    bottom: 13%;
    width: 560px;
    height: 1px;
    background: #24231f;
    box-shadow: 0 20px 40px rgba(0,0,0,.7);
}

.lamp {
    position: absolute;
    bottom: calc(13% + 1px);
    width: 80px;
    height: 90px;
    transform: translateY(50%);
}

.lamp::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 35px;
    background: #302f29;
}

.lamp::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 45px;
    height: 30px;
    transform: translateX(-50%);
    border-radius: 50% 50% 8px 8px;
    background: #26251f;
    box-shadow: 0 0 70px rgba(150,140,90,.08);
}

.content {
    position: relative;
    z-index: 5;
    width: min(650px, 80vw);
    margin-top: 16vh;
}

.meta {
    display: flex;
    justify-content: space-between;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: .2em;
    margin-bottom: 65px;
    text-transform: uppercase;
}

.title {
    font-family: "Libre Baskerville", serif;
    font-size: clamp(30px, 5vw, 58px);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -.04em;
    color: #aaa69a;
    position: relative;
    width: fit-content;
}

.title::after {
    content: "you are still here";
    position: absolute;
    inset: 0;
    color: var(--red);
    opacity: 0;
    transform: translate(2px, 0);
}

.title.glitch::after {
    opacity: .4;
    animation: glitch 180ms steps(2) infinite;
}

.subtitle {
    margin-top: 20px;
    color: #504d45;
    font-size: 11px;
    letter-spacing: .12em;
}

.message {
    margin-top: 90px;
    max-width: 390px;
    color: #68645b;
    font-size: 12px;
    line-height: 2;
}

.message span {
    display: block;
}

.message .hidden {
    color: #171613;
    transition: color 2s ease;
}

.message:hover .hidden {
    color: #5b2929;
}

.clock {
    position: fixed;
    right: 35px;
    bottom: 28px;
    color: #3b3933;
    font-size: 10px;
    letter-spacing: .12em;
}

.status {
    position: fixed;
    left: 35px;
    bottom: 28px;
    color: #332f2b;
    font-size: 9px;
    letter-spacing: .18em;
}

.dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 8px;
    border-radius: 50%;
    background: #4a2424;
    box-shadow: 0 0 8px #4a2424;
    animation: pulse 3s infinite;
}

.whisper {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #292720;
    font-size: 8px;
    letter-spacing: .4em;
    opacity: 0;
    pointer-events: none;
}

body.awake .whisper {
    animation: whisper 7s ease forwards;
}

@keyframes pulse {
    0%, 100% { opacity: .2; }
    50% { opacity: 1; }
}

@keyframes glitch {
    0% { clip-path: inset(20% 0 65% 0); }
    50% { clip-path: inset(65% 0 15% 0); }
    100% { clip-path: inset(40% 0 35% 0); }
}

@keyframes whisper {
    0% { opacity: 0; }
    20% { opacity: .15; }
    35% { opacity: 0; }
    55% { opacity: .12; }
    70% { opacity: 0; }
    100% { opacity: 0; }
}

@media (max-width: 600px) {
    .window {
        width: 190px;
        height: 300px;
    }

    .shadow {
        display: none;
    }

    .table {
        width: 80vw;
    }

    .meta {
        margin-bottom: 40px;
    }

    .message {
        margin-top: 55px;
    }

    .status,
    .clock {
        bottom: 18px;
    }

    .status {
        left: 18px;
    }

    .clock {
        right: 18px;
    }
}
</style>
</head>
<body>

<div class="noise"></div>

<div class="room">
    <div class="window"></div>
    <div class="shadow"></div>
    <div class="table"></div>
    <div class="lamp"></div>
</div>

<div class="content">
    <div class="meta">
        <span>archive / 04</span>
        <span id="date">00:00:00</span>
    </div>

    <h1 class="title" id="title">you are still here</h1>

    <p class="subtitle">
        nobody has been here for a while.
    </p>

    <div class="message">
        <span>the room remembers the shape of you.</span>
        <span>the chair is still facing the door.</span>
        <span>the light was left on.</span>
        <span class="hidden">don't turn around.</span>
    </div>
</div>

<div class="whisper">DON'T LOOK BEHIND YOU</div>

<div class="status">
    <span class="dot"></span>
    SIGNAL PRESENT
</div>

<div class="clock" id="clock">--:--:--</div>

<script>
const clock = document.getElementById("clock");
const title = document.getElementById("title");

function updateClock() {
    const now = new Date();
    clock.textContent = now.toLocaleTimeString("en-GB", {
        hour12: false
    });
}

setInterval(updateClock, 1000);
updateClock();

setTimeout(() => {
    document.body.classList.add("awake");
}, 3500);

setInterval(() => {
    if (Math.random() < 0.18) {
        title.classList.add("glitch");

        setTimeout(() => {
            title.classList.remove("glitch");
        }, 180 + Math.random() * 300);
    }
}, 2500);

document.addEventListener("mousemove", e => {
    const x = (e.clientX / window.innerWidth - .5) * 4;
    const y = (e.clientY / window.innerHeight - .5) * 3;

    document.querySelector(".shadow").style.transform =
        `translate(${x}px, ${y}px) scaleX(.65)`;
});

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        document.title = "come back";
    } else {
        document.title = "you are still here";
    }
});
</script>

</body>
</html>
